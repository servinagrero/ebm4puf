[project]
name = "ebm4puf"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sergio Vinagrero", email = "servinagrero@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "torch>=2.14.1",
]

